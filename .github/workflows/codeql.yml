name: CodeQL

on:
  push:
    branches: [main, portfolio]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (C#, security-extended)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Code scanning upload needs GitHub Code Security on private repos. When the repo is private the
      # results are kept as a SARIF artifact and checked below instead; public repos upload normally.
      UPLOAD: ${{ github.event.repository.private && 'never' || 'always' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          dotnet restore BobberBell.slnx --locked-mode
          dotnet build BobberBell.slnx -c Release --no-restore

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Summarize and gate on findings
        shell: pwsh
        run: |
          $results = @()
          foreach ($f in Get-ChildItem sarif-results -Filter *.sarif) {
            $sarif = Get-Content $f.FullName -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) { $results += @($run.results) }
          }
          $errors = @($results | Where-Object { $_.level -eq 'error' })
          "### CodeQL: $($results.Count) finding(s), $($errors.Count) error-level" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($r in $results) {
            $loc = $r.locations[0].physicalLocation
            "- **$($r.ruleId)** ($($r.level)) $($loc.artifactLocation.uri):$($loc.region.startLine)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          if ($errors.Count -gt 0) { Write-Error "CodeQL reported $($errors.Count) error-level finding(s)"; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30
