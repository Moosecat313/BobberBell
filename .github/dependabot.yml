version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/BobberBell"
      - "/src/BobberBell.Core"
      - "/tests/BobberBell.Tests"
      - "/tools/BobberBell.DetectionHarness"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # NAudio 3.x breaks SoundFingerprinting.Audio.NAudio 8.0.0 (ISampleProvider.Read signature change).
      # Re-enable once SoundFingerprinting.Audio.NAudio supports NAudio 3.
      - dependency-name: "NAudio*"
        update-types: ["version-update:semver-major"]
    groups:
      naudio:
        patterns: ["NAudio*"]
      soundfingerprinting:
        patterns: ["SoundFingerprinting*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
